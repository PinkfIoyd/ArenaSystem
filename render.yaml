services:
  - type: web
    name: arenaflow-api-demo
    runtime: python
    rootDir: arenasystem
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate && python manage.py check
    startCommand: gunicorn arenasystem.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /api/health/
    autoDeploy: false
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: DEBUG
        value: "False"
      - key: DEMO_MODE
        value: "True"
      - key: DEFAULT_ARENA_SLUG
        value: arenasystem-demo
      - key: USE_X_FORWARDED_PROTO
        value: "True"
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: SESSION_COOKIE_SECURE
        value: "True"
      - key: CSRF_COOKIE_SECURE
        value: "True"
      - key: SECURE_HSTS_SECONDS
        value: "31536000"
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: DEMO_ADMIN_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: PUBLIC_BACKEND_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: arenaflow-redis-demo
          property: connectionString
      - key: MERCADO_PAGO_SAAS_ACCESS_TOKEN
        sync: false
      - key: MERCADO_PAGO_SAAS_WEBHOOK_SECRET
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: SENTRY_DSN
        sync: false

  - type: worker
    name: arenaflow-worker-demo
    runtime: python
    rootDir: arenasystem
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A arenasystem worker --loglevel=info --concurrency=2
    autoDeploy: false
    envVars:
      - key: DEBUG
        value: "False"
      - key: DEMO_MODE
        value: "True"
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: arenaflow-redis-demo
          property: connectionString
      - key: FRONTEND_URL
        sync: false
      - key: PUBLIC_BACKEND_URL
        sync: false
      - key: MERCADO_PAGO_SAAS_ACCESS_TOKEN
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false

  - type: worker
    name: arenaflow-beat-demo
    runtime: python
    rootDir: arenasystem
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A arenasystem beat --loglevel=info
    autoDeploy: false
    envVars:
      - key: DEBUG
        value: "False"
      - key: DEMO_MODE
        value: "True"
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: arenaflow-redis-demo
          property: connectionString

  - type: keyvalue
    name: arenaflow-redis-demo
    plan: free
    ipAllowList: []
